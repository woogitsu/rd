name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build:import
      - run: npm run build:panel
      - run: npm run build:ledger
      - run: npm run build:print
      - run: npm run build:events
      - run: npm run build:documents
      - run: npm run build:site
      - run: npm run build:meetings
      - run: npm run build:admin
      - run: npm run build:families
      - run: test -f dist/import/template.csv
      - run: test -f railway.json
      # PostgreSQL migrations on in-memory PGlite + Node server on 127.0.0.1
      # (ephemeral port): /health and built panels. No Docker, no network
      # services, no secrets and no Railway access.
      - run: npm run smoke
      - run: npm run db:migrate:local
