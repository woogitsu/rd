name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Anuluj poprzedni przebieg tej samej gałęzi/PR, gdy przyjdzie nowy push —
# 17 runnerów self-hosted jest współdzielonych między agentami (#111).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Testy bez potrzeby prawdziwego PostgreSQL, shardowane na 4 równoległe
  # joby (node --test --test-shard=i/N). Każdy shard uruchamia cały zestaw
  # tests/*.test.js z --test-concurrency=2, żeby ograniczyć liczbę
  # równoległych instancji PGlite (każda ~550 MB, #111).
  test:
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Testy wyścigów na prawdziwym PostgreSQL (tests/pg-reconciliation-race.test.js,
    # współbieżność w pg-primary-household.test.js, #208) są pomijane bez
    # RD_TEST_PG_URL / RD_TEST_DATABASE_URL. Runnery self-hosted nie mają Dockera
    # (`services:` kończył się na „Initialize containers”), więc serwer PostgreSQL
    # trzeba zainstalować na runnerach i ustawić te zmienne osobno.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 --import ./tests/setup.js tests/*.test.js

  # #153: łańcuch dostaw. Blokuje przy podatnościach high/critical w
  # zależnościach produkcyjnych, przy podatnościach critical w całym drzewie
  # i przy braku podpisów rejestru. Osobny job (podział zgodny z #111), żeby
  # awaria audytu nie mieszała się z testami.
  audit:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      # Blokujące: podatności high/critical w zależnościach produkcyjnych.
      - run: npm audit --omit=dev --audit-level=high
      # Blokujące: podatności critical w całym drzewie (także deweloperskim).
      - run: npm audit --audit-level=critical
      # Ostrzeżenie (nie oblewa buildu): pełny raport low/moderate/high jako
      # artefakt do przeglądu (lista wyjątków, patrz docs/RAILWAY_OPERATIONS.md).
      - run: npm audit --json > npm-audit-report.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 14
      # Weryfikacja podpisów i atestacji rejestru npm.
      - run: npm audit signatures

  build:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      # Jeden skrypt buduje wszystkie panele (package.json) — nowa aplikacja
      # nie wymaga osobnego kroku w CI.
      - run: npm run build
      - run: test -f dist/import/template.csv
      # #188/#223: zbudowane strony bez inline <style>, style=, skryptów inline (CSP z src/node-app.js).
      - run: REQUIRE_DIST=1 node --test tests/csp-static.test.js
      - run: test -f railway.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  smoke:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # PostgreSQL migrations on in-memory PGlite + Node server on 127.0.0.1
      # (ephemeral port): /health and built panels. No Docker, no network
      # services, no secrets and no Railway access.
      - run: npm run smoke
      - run: npm run db:migrate:local

  # Integralność i kolejność migracji PostgreSQL (issue #79): manifest sum
  # kontrolnych aktualny, a PR ani nie zmienia scalonego pliku migracji, ani
  # nie dokłada nowego z numerem <= maksimum na gałęzi bazowej. Kontrola
  # numeracji potrzebuje historii gałęzi bazowej — tylko dla pull_request.
  migrations-order:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run migrations:manifest -- --check
      - run: npm run migrations:check-functions
      - if: github.event_name == 'pull_request'
        # fetch-depth: 0 pobiera już origin/<base>; osobny git fetch nie ma
        # poświadczeń (persist-credentials: false).
        run: |
          node scripts/check-migrations-order.js --base origin/${{ github.event.pull_request.base.ref }}

  # Pierwsze testy przeglądarkowe (Playwright) kluczowych ścieżek: logowanie
  # admina z MFA (TOTP liczony w teście) i wejście do admin/, granica ról
  # przedstawiciela w families/, zapis wpłaty przez skarbnika w panel/, oraz
  # site/ bez danych niezatwierdzonych — wszystko na serwerze Node + PGlite
  # (dane wyłącznie syntetyczne, e-mail nigdy nie jest wysyłany — serwer HTTP
  # nie robi tego synchronicznie, patrz tests/e2e/support/server.js).
  #
  # Chromium jest wstępnie zainstalowany na runnerach self-hosted w
  # /opt/pw-browsers (PLAYWRIGHT_BROWSERS_PATH ustawiony na poziomie
  # runnera) — `playwright install` celowo NIE jest tu wywoływane: runnery
  # nie mają Dockera ani gwarantowanego sudo/dostępu do sieci, patrz
  # komentarz w playwright.config.js.
  #
  # CELOWO nie jest wymagany przez ci-ok (continue-on-error): dopóki to nie
  # zostanie potwierdzone na realnym runnerze, awaria tego joba nie blokuje
  # PR — patrz opis w PR.
  e2e:
    runs-on: self-hosted
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Jedyny wymagany check: oblewa, gdy którykolwiek z powyższych jobów nie
  # zakończył się sukcesem (włącznie z anulowaniem albo pominięciem). `e2e`
  # jest CELOWO poza tą listą (patrz komentarz przy tym jobie).
  ci-ok:
    needs: [test, audit, build, smoke, migrations-order]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Wszystkie joby zielone
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "audit: ${{ needs.audit.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "smoke: ${{ needs.smoke.result }}"
          echo "migrations-order: ${{ needs.migrations-order.result }}"
          if [ "${{ needs.test.result }}" != "success" ] ||
             [ "${{ needs.audit.result }}" != "success" ] ||
             [ "${{ needs.build.result }}" != "success" ] ||
             [ "${{ needs.smoke.result }}" != "success" ] ||
             [ "${{ needs.migrations-order.result }}" != "success" ]; then
            echo "Co najmniej jeden wymagany job nie zakończył się sukcesem." >&2
            exit 1
          fi
