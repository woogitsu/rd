name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Repozytorium jest publiczne: CI działa wyłącznie na runnerach hostowanych
# przez GitHub (`ubuntu-latest`, 2 rdzenie, 7 GB). Nie używamy runnerów
# self-hosted (kod z PR-ów spoza zespołu nie może działać na naszych maszynach),
# wyzwalacza z uprawnieniami zapisu ani sekretów — patrz docs/RAILWAY_OPERATIONS.md.
#
# Anuluj poprzedni przebieg tej samej gałęzi/PR, gdy przyjdzie nowy push.
concurrency:
  # Prefiks „hosted-”: zablokowane uruchomienia z dawnych runnerów self-hosted
  # (zadanie ci-ok w kolejce, anulowanie nie działa) trzymały starą grupę.
  group: ci-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Testy bez potrzeby prawdziwego PostgreSQL, podzielone na 6 równoległych
  # jobów. Listę plików shardu i/N wybiera scripts/ci-shard-files.js według
  # zmierzonych czasów (scripts/ci-shard-weights.json), a nie według pozycji
  # na liście jak `--test-shard` (#111: jeden shard zbierał najdłuższe pliki).
  # Każdy plik tests/*.test.js trafia do dokładnie jednego shardu (pilnuje
  # tests/ci-shard-coverage.test.js). --test-concurrency=2 ogranicza liczbę
  # równoległych instancji PGlite (każda ~550 MB, #111); runner hostowany ma
  # 2 rdzenie, więc zestaw dzielimy na 6 shardów zamiast podnosić limit czasu.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Testy wyścigów na prawdziwym PostgreSQL (#208) są w tym jobie pomijane
    # (bez RD_TEST_PG_URL) — biegną w osobnym jobie `test-pg-real`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # #111: tests/setup.js dopisuje do RD_TEST_RSS_LOG szczytowy RSS każdego procesu testowego;
      # krok niżej zamienia to na tabelę w podsumowaniu joba (docs/RAILWAY_OPERATIONS.md, „CI i runnery”).
      # Przypisanie do zmiennej przerywa krok (bash -e), gdy skrypt podziału zawiedzie;
      # bez tego `node --test` bez plików uruchomiłby domyślny wzorzec (cały katalog).
      - run: |
          files=$(node scripts/ci-shard-files.js ${{ matrix.shard }} 6)
          test -n "$files"
          node --test --test-concurrency=2 --import ./tests/setup.js $files
        env:
          RD_TEST_RSS_LOG: ${{ runner.temp }}/test-rss.log
      - if: always()
        run: node scripts/summarize-test-memory.js "$RD_TEST_RSS_LOG" "Pamięć testów, shard ${{ matrix.shard }}/6" >> "$GITHUB_STEP_SUMMARY"
        env:
          RD_TEST_RSS_LOG: ${{ runner.temp }}/test-rss.log

  # #153: łańcuch dostaw. Blokuje przy podatnościach high/critical w
  # zależnościach produkcyjnych, przy podatnościach critical w całym drzewie
  # i przy braku podpisów rejestru. Osobny job (podział zgodny z #111), żeby
  # awaria audytu nie mieszała się z testami.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # Blokujące: podatności high/critical w zależnościach produkcyjnych.
      - run: npm audit --omit=dev --audit-level=high
      # Blokujące: podatności critical w całym drzewie (także deweloperskim).
      - run: npm audit --audit-level=critical
      # Ostrzeżenie (nie oblewa buildu): pełny raport low/moderate/high jako
      # artefakt do przeglądu (lista wyjątków, patrz docs/RAILWAY_OPERATIONS.md).
      - run: npm audit --json > npm-audit-report.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 14
      # Weryfikacja podpisów i atestacji rejestru npm.
      - run: npm audit signatures

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # Jeden skrypt buduje wszystkie panele (package.json) — nowa aplikacja
      # nie wymaga osobnego kroku w CI.
      - run: npm run build
      - run: test -f dist/import/template.csv
      # #188/#223: zbudowane strony bez inline <style>, style=, skryptów inline (CSP z src/node-app.js).
      - run: REQUIRE_DIST=1 node --test tests/csp-static.test.js
      - run: test -f railway.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # PostgreSQL migrations on in-memory PGlite + Node server on 127.0.0.1
      # (ephemeral port): /health and built panels. No Docker, no network
      # services, no secrets and no Railway access.
      - run: npm run smoke
      - run: npm run db:migrate:local

  # Testy na PRAWDZIWYM PostgreSQL (#208): wyścigi i współbieżność, które na
  # PGlite (jeden proces, jedno połączenie) nie mają sensu. Serwer to usługa
  # `services:` (obraz przypięty do digestu sha256, jak akcje — #153), dostępna
  # tylko na 127.0.0.1 runnera; dane wyłącznie syntetyczne, bez sekretów
  # (hasło poniżej dotyczy wyłącznie efemerycznego kontenera CI).
  # Skrypt `scripts/test-pg-real.js` przy ustawionym RD_TEST_PG_URL używa tego
  # serwera zamiast uruchamiać własny (docs/TESTING.md).
  test-pg-real:
    runs-on: ubuntu-latest
    # 30 -> 45 min (#208): kontrola mutacyjna ma teraz 42 mutanty (po ~10 s lokalnie na każdy)
    # i dwa dodatkowe pliki z barierą; zapas ≥ 20% względem pomiaru z podsumowania joba.
    timeout-minutes: 45
    services:
      postgres:
        # postgres:16 (multi-arch index) przypięty do digestu.
        image: postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: rd_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RD_TEST_PG_URL: postgres://postgres:rd_ci_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:pg-real
      # Kontrola mutacyjna blokad (#208): usunięcie każdej blokady z listy w
      # scripts/check-lock-mutations.js (FOR UPDATE / pg_advisory_xact_lock)
      # musi dać czerwony test. Kod repozytorium nie jest zmieniany (kopia).
      - run: npm run test:pg-mutations

  # Integralność i kolejność migracji PostgreSQL (issue #79): manifest sum
  # kontrolnych aktualny, a PR ani nie zmienia scalonego pliku migracji, ani
  # nie dokłada nowego z numerem <= maksimum na gałęzi bazowej. Kontrola
  # numeracji potrzebuje historii gałęzi bazowej — tylko dla pull_request.
  migrations-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run migrations:manifest -- --check
      - run: npm run migrations:check-functions
      - if: github.event_name == 'pull_request'
        # fetch-depth: 0 pobiera już origin/<base>; osobny git fetch nie ma
        # poświadczeń (persist-credentials: false).
        run: |
          node scripts/check-migrations-order.js --base origin/${{ github.event.pull_request.base.ref }}

  # #160: sprawdzanie typów JSDoc (`tsc --noEmit`) dla plików wskazanych w
  # jsconfig.json. Osobny, lekki job; lista plików rośnie stopniowo.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # Pierwsze testy przeglądarkowe (Playwright) kluczowych ścieżek: logowanie
  # admina z MFA (TOTP liczony w teście) i wejście do admin/, granica ról
  # przedstawiciela w families/, zapis wpłaty przez skarbnika w panel/, oraz
  # site/ bez danych niezatwierdzonych — wszystko na serwerze Node + PGlite
  # (dane wyłącznie syntetyczne, e-mail nigdy nie jest wysyłany — serwer HTTP
  # nie robi tego synchronicznie, patrz tests/e2e/support/server.js).
  #
  # Na runnerze hostowanym GitHub Chromium instalujemy jawnie
  # (`playwright install --with-deps`, sudo jest tam dostępne).
  #
  # CELOWO nie jest wymagany przez ci-ok (continue-on-error): awaria tego
  # joba nie blokuje PR, dopóki testy przeglądarkowe nie okażą się stabilne
  # na runnerze hostowanym.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Jedyny wymagany check: oblewa, gdy którykolwiek z powyższych jobów nie
  # zakończył się sukcesem (włącznie z anulowaniem albo pominięciem). `e2e`
  # jest CELOWO poza tą listą (patrz komentarz przy tym jobie).
  ci-ok:
    needs: [test, test-pg-real, audit, build, smoke, migrations-order, typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wszystkie joby zielone
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "test-pg-real: ${{ needs.test-pg-real.result }}"
          echo "audit: ${{ needs.audit.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "smoke: ${{ needs.smoke.result }}"
          echo "migrations-order: ${{ needs.migrations-order.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          if [ "${{ needs.test.result }}" != "success" ] ||
             [ "${{ needs.test-pg-real.result }}" != "success" ] ||
             [ "${{ needs.audit.result }}" != "success" ] ||
             [ "${{ needs.build.result }}" != "success" ] ||
             [ "${{ needs.smoke.result }}" != "success" ] ||
             [ "${{ needs.migrations-order.result }}" != "success" ] ||
             [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "Co najmniej jeden wymagany job nie zakończył się sukcesem." >&2
            exit 1
          fi
