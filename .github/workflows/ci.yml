name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Anuluj poprzedni przebieg tej samej gałęzi/PR, gdy przyjdzie nowy push —
# 17 runnerów self-hosted jest współdzielonych między agentami (#111).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Testy bez potrzeby prawdziwego PostgreSQL, shardowane na 4 równoległe
  # joby (node --test --test-shard=i/N). Każdy shard uruchamia cały zestaw
  # tests/*.test.js z --test-concurrency=2, żeby ograniczyć liczbę
  # równoległych instancji PGlite (każda ~550 MB, #111).
  test:
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Testy wyścigów na prawdziwym PostgreSQL (tests/pg-reconciliation-race.test.js,
    # współbieżność w pg-primary-household.test.js, #208) są pomijane bez
    # RD_TEST_PG_URL / RD_TEST_DATABASE_URL. Runnery self-hosted nie mają Dockera
    # (`services:` kończył się na „Initialize containers”), więc serwer PostgreSQL
    # trzeba zainstalować na runnerach i ustawić te zmienne osobno.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 tests/*.test.js

  build:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Jeden skrypt buduje wszystkie panele (package.json) — nowa aplikacja
      # nie wymaga osobnego kroku w CI.
      - run: npm run build
      - run: test -f dist/import/template.csv
      # #188/#223: zbudowane strony bez inline <style>, style=, skryptów inline (CSP z src/node-app.js).
      - run: REQUIRE_DIST=1 node --test tests/csp-static.test.js
      - run: test -f railway.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  smoke:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # PostgreSQL migrations on in-memory PGlite + Node server on 127.0.0.1
      # (ephemeral port): /health and built panels. No Docker, no network
      # services, no secrets and no Railway access.
      - run: npm run smoke
      - run: npm run db:migrate:local

  # Jedyny wymagany check: oblewa, gdy którykolwiek z powyższych jobów nie
  # zakończył się sukcesem (włącznie z anulowaniem albo pominięciem).
  ci-ok:
    needs: [test, build, smoke]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Wszystkie joby zielone
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "smoke: ${{ needs.smoke.result }}"
          if [ "${{ needs.test.result }}" != "success" ] ||
             [ "${{ needs.build.result }}" != "success" ] ||
             [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "Co najmniej jeden wymagany job nie zakończył się sukcesem." >&2
            exit 1
          fi
